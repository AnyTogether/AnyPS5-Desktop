name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on a branch with update_goldens, the goldens job remakes the golden files on
  # macOS (where they are made) and uploads them as the updated-goldens artifact, to commit:
  # gh workflow run ci.yml -R AnyTogether/AnyPS5-Desktop --ref <branch> -f update_goldens=true
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Remake the golden files and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.1
  # libpulse-dev: flutter_webrtc's Linux loopback capture (share play's Opus track) builds only
  # with it; the bundle then needs libpulse0, which PulseAudio and PipeWire systems have.
  LINUX_PACKAGES: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsdl2-2.0-0 libpulse-dev file
  # libmpv-dev: the in-app clip player (media_kit_video links libmpv); patchelf: the bundle carries
  # that libmpv and what it needs in lib/ (packaging/linux/bundle-libmpv.sh).
  CLIP_PLAYER_PACKAGES: libmpv-dev patchelf

jobs:
  test:
    name: flutter analyze and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The native hook builds the ATRAC9 decoder with the system compiler for flutter test too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The language files (TRANSLATING.md): flat JSON for Weblate, no unknown keys, English's
      # placeholders; the log has each language's coverage. Then lib: no text picked by the
      # language's code and no Turkish words outside the files.
      - name: Check the language files in assets/l10n and the texts in lib
        run: dart run tool/check_translations.dart
      # The goldens are made on macOS and compared in the goldens job (test/flutter_test_config.dart).
      - run: flutter test
        env:
          ANYPS5_SKIP_GOLDENS: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-failures-linux
          path: test/**/failures/
          if-no-files-found: ignore

  goldens:
    name: golden tests and the recursive watcher (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The goldens are made on macOS; the library watcher's one recursive watch is the macOS and
      # Windows mode, which the Linux job skips.
      - name: Run the test files that compare goldens, and the library watcher's
        if: ${{ !inputs.update_goldens }}
        run: flutter test $(grep -rl matchesGoldenFile test | sort) test/core/library_watch_test.dart
      - name: Remake the golden files
        if: ${{ inputs.update_goldens }}
        run: flutter test --update-goldens $(grep -rl matchesGoldenFile test | sort)
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_goldens }}
        with:
          name: updated-goldens
          path: test/**/goldens/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-failures-macos
          path: test/**/failures/
          if-no-files-found: ignore

  linux:
    name: flutter build linux (Ubuntu 22.04)
    # The oldest distro the packages are for: glibc 2.35, GTK 3 from the system.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES $CLIP_PLAYER_PACKAGES
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
        env:
          # The bundle has to carry libmpv here: no patchelf or no libmpv fails the build.
          ANYPS5_REQUIRE_LIBMPV: 1
      - name: Bundle size and the libraries carried for the clip player
        run: |
          du -sh build/linux/x64/release/bundle build/linux/x64/release/bundle/lib
          ls build/linux/x64/release/bundle/lib | grep -c . | xargs echo "files in lib/:"
          ls build/linux/x64/release/bundle/lib/libmpv.so.*
      # Ubuntu 24.04 has libmpv.so.2, not the 22.04 build machine's libmpv.so.1: the clip player's
      # plugin and the libmpv it carries have to find everything they link in lib/ or in what a
      # GTK desktop has.
      - name: Check the clip player's libraries resolve on Ubuntu 24.04 without libmpv
        run: |
          docker run --rm -v "$PWD/build/linux/x64/release/bundle:/bundle:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libgtk-3-0t64 libegl1 libgl1 libgbm1 libdrm2 libasound2t64 libpipewire-0.3-0t64 libusb-1.0-0 \
              libsm6 libice6 libgmp10 libgpg-error0 libpulse0 >/dev/null
            if ldconfig -p | grep -q "libmpv\.so"; then echo "this image has a libmpv"; exit 1; fi
            missing=$(for f in /bundle/lib/libmedia_kit_video_plugin.so /bundle/lib/libmpv.so.*; do ldd "$f" | grep "not found" || true; done | sort -u)
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
            echo "every library resolves:"
            ldd /bundle/lib/libmpv.so.* | grep -c "/bundle/lib/" | xargs echo "  from the bundle:"
            ldd /bundle/lib/libmpv.so.* | grep -vc "/bundle/lib/" | xargs echo "  from the system:"
          '
      - name: Package the AppImage, the .deb and the .tar.gz
        if: github.event_name != 'pull_request'
        run: |
          SKIP_BUILD=1 bash packaging/linux/build-appimage.sh
          SKIP_BUILD=1 bash packaging/linux/build-deb.sh
          tar -C build/linux/x64/release -czf build/packages/AnyPS5-Desktop-linux-x64.tar.gz --transform 's#^bundle#AnyPS5-Desktop#' bundle
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: linux-packages
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: flutter build windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      # The clip player's libmpv and ANGLE (media_kit_libs_windows_video) beside the launcher: the
      # installer and the .zip take the whole folder.
      - name: Check the clip player's libraries are beside the launcher
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "libmpv-2.dll", "libEGL.dll", "libGLESv2.dll", "media_kit_video_plugin.dll") {
            if (-not (Test-Path (Join-Path $release $dll))) { Write-Error "no $dll in $release"; exit 1 }
          }
          Get-ChildItem $release -Filter *.dll | Sort-Object Length -Descending | Select-Object -First 8 Name, @{n = "MiB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize
      - name: Package the installer (Inno Setup 6)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup --no-progress -y }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1 -SkipBuild
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\AnyPS5-Desktop-windows-x64.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: windows-packages
          path: build/installer/*
          if-no-files-found: error
          retention-days: 14

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, goldens, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::Not passed: $bad"; exit 1; fi
