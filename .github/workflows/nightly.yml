# A nightly AnyPS5 Desktop launcher, built from main once a day when the launcher changed and
# published as a GitHub pre-release for its Nightly update channel. As AnyPS5-ARM's nightlies
# (engine-nightly.yml there).
#
# The tag: v<next>-nightly.<YYYYMMDD>.<n>, <next> being the last release with its last number
# raised and <n> counting that day's nightlies from 1 (UTC). The launcher sorts these after the
# release before them and before the release they lead to (lib/core/update_channel.dart). The
# build calls itself by that version (packaging/set-version.sh), so that it knows it is that
# nightly.
#
# The build is ci.yml's, called with the commit and the version: analyze, tests, goldens and both
# builds with their packages, and nothing is published unless all of them passed.
#
# CI has no signing key, so the pre-release comes out unsigned, and the launcher does not offer it
# until tools/release/sign_nightly.sh -R AnyTogether/AnyPS5-Desktop <tag> (AnyPS5-ARM) has added
# SHA256SUMS and SHA256SUMS.sig on the release Mac.
#
# It never reaches Stable: --prerelease and --latest=false keep it out of the release GitHub calls
# latest, which is what the Stable channel and the download links read. The tag and the release
# are made with GITHUB_TOKEN, so they start no other workflow.
#
# GITHUB_TOKEN can make no tag at a commit whose .github/workflows/ has a file main lacks or has
# otherwise (GitHub answers 403 Resource not accessible by integration; that needs the Workflows
# permission, which GITHUB_TOKEN cannot be given). The built commit is main as it was when the run
# began, so that happens when main gets a workflow change while the build runs. The publish job
# then publishes nothing and starts this workflow again on main, which builds main as it is by
# then; it ends green with a warning.
name: Nightly

on:
  schedule:
    # Before the release Mac's nightly job (04:45 UTC, tools/release/nightly_mac.sh in AnyPS5-ARM).
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even without launcher changes, or when today already has a nightly.
        type: boolean
        default: false
      dry_run:
        description: Plan and build, but make no tag and no release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          sha="$(git rev-parse HEAD)"
          skip() { echo "::notice::No nightly: $1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The last release: the highest vX.Y.Z tag (nightly tags have more after the numbers).
          last="$(git tag -l 'v*' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          [ -n "$last" ] || { echo "::error::No release tag found"; exit 1; }
          next="$(echo "$last" | awk -F. '{ $NF = $NF + 1; print }' OFS=.)"
          day="$(date -u +%Y%m%d)"
          count=1
          for candidate in $(git tag -l "v$next-nightly.$day.*"); do
            n="${candidate##*.}"
            case "$n" in *[!0-9]*|'') continue ;; esac
            [ "$n" -ge "$count" ] && count=$((n + 1))
          done
          tag="v$next-nightly.$day.$count"

          last_nightly="$(gh api "repos/$REPO/releases?per_page=50" --jq '
            [.[] | select(.draft | not) | select(.prerelease) | select(.tag_name | test("^v[0-9.]+-nightly\\."))]
            | sort_by(.created_at) | last | .tag_name // empty')"
          echo "last release v$last, last nightly: ${last_nightly:-none}, next tag $tag"

          if [ -n "$last_nightly" ] && [ "$(git rev-list -n 1 "$last_nightly")" = "$sha" ]; then
            skip "$last_nightly already is main's nightly"
          fi
          # Changes are counted from that nightly when it is past the last release, else from the release.
          base="v$last"
          if [ -n "$last_nightly" ] && git merge-base --is-ancestor "$base" "$last_nightly" &&
            git merge-base --is-ancestor "$last_nightly" HEAD; then
            base="$last_nightly"
          fi
          if [ "$FORCE" != true ]; then
            case "$last_nightly" in
              *-nightly."$day".*) skip "today already has $last_nightly" ;;
            esac
            # Tests, documents and workflows alone change nothing in the launcher.
            if git diff --quiet "$base" HEAD -- . ':(exclude)test/' ':(exclude)docs/' ':(exclude).github/' ':(exclude)*.md'; then
              skip "the launcher has not changed since $base"
            fi
          fi
          {
            echo "build=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: Publish the pre-release
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # To start the workflow again when the built commit cannot be tagged (see the top).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-packages'
          path: dist
          merge-multiple: true
      - name: Check the files and write the notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          # What the launcher updates itself from.
          for wanted in "AnyPS5-Desktop-Setup-$VERSION-x64.exe" "AnyPS5-Desktop-$VERSION-x86_64.AppImage" AnyPS5-Desktop-linux-x64.tar.gz; do
            [ -f "dist/$wanted" ] || { echo "::error::no $wanted"; exit 1; }
          done
          git fetch -q --tags --force origin
          previous="$(git tag -l 'v*' --sort=-creatordate --merged HEAD | sed -n 1p)"
          {
            echo "Nightly build of main, $(date -u +%Y-%m-%d), $(git rev-parse --short=12 HEAD). It may have new bugs: the launcher offers it only on its Nightly update channel."
            echo
            echo "It is unsigned until it is signed on the release Mac. The launcher does not offer it until then."
            echo
            echo "Since ${previous:-the start}:"
            echo
            # git stops at 40 itself: head would close the pipe early and pipefail would fail the job (141).
            git log --no-merges --max-count=40 --format='- %s' ${previous:+"$previous..HEAD"}
            total="$(git rev-list --no-merges --count ${previous:+"$previous..HEAD"})"
            [ "$total" -le 40 ] || echo "- … and $((total - 40)) more"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists already"; exit 1
          fi
          # GITHUB_TOKEN cannot tag the built commit once main has other workflows than it (see the
          # top): main's nightly is then left to a new run of this workflow.
          start_over() {
            local changed
            git fetch -q origin main
            changed="$(git diff --name-only --no-renames --diff-filter=d FETCH_HEAD "$SHA" -- .github/workflows)"
            [ -n "$changed" ] || return 1
            echo "::warning::$TAG is not published: main ($(git rev-parse --short=10 FETCH_HEAD)) changed workflows while ${SHA:0:10} was built (${changed//$'\n'/ }), and GITHUB_TOKEN cannot tag such a commit. Starting the nightly again on main."
            gh workflow run nightly.yml --repo "$REPO" --ref main -f force="$FORCE"
          }
          if start_over; then exit 0; fi
          # The tag is made on GitHub at the built commit.
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "AnyPS5 Desktop $VERSION (nightly)" --notes-file "$RUNNER_TEMP/notes.md" ||
            { if start_over; then exit 0; fi; exit 1; }
          # Stable must never see it.
          [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = true ] ||
            { echo "::error::$TAG is not a pre-release"; exit 1; }
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" != "$TAG" ] ||
            { echo "::error::$TAG became the latest release"; exit 1; }
          echo "published https://github.com/$REPO/releases/tag/$TAG"
