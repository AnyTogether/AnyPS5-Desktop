name: anyps5_desktop
description: "AnyPS5 launcher for Windows and Linux."
publish_to: 'none'
version: 0.1.23+24

environment:
  sdk: ^3.13.1

dependencies:
  archive: ^4.5.2
  code_assets: ^2.1.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  dbus: ^0.8.0
  desktop_drop: ^0.8.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.1
  flutter_webrtc: ^1.6.2
  hooks: ^2.2.0
  livekit_client: 2.13.1
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  native_toolchain_c: ^0.19.5
  path: ^1.9.1
  pinenacl: ^0.6.0
  qr: ^3.0.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  uses-material-design: true
  shaders:
    - shaders/background.frag
  assets:
    - assets/fonts/Figtree-OFL.txt
    # Play from a browser: the pad page phones get (lib/core/remote/browser_pad_server.dart), a copy
    # of the macOS launcher's tools/macos/launcher/BrowserPad/index.html (tool/sync_browser_pad.sh).
    - assets/browser_pad/index.html
    # The Noto fonts games get in place of the console's system fonts (SIL Open Font License
    # 1.1, OFL.txt beside them). The engine reads them from disk, from data/flutter_assets.
    - assets/system-fonts/
    # The launcher's languages, one JSON file each (TRANSLATING.md): a new file there is a new
    # language in Settings, found through the asset manifest.
    - assets/l10n/
    # The countries' names in each language, from ICU's data (tool/make_countries.mjs).
    - assets/countries.json
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    # Commands to copy, as a terminal prints them (the libmpv notice over a clip on Linux): the
    # Noto Sans Mono the engine's typewriter font set already carries, so nothing more is shipped.
    - family: NotoSansMono
      fonts:
        - asset: assets/system-fonts/NotoSansMono-Regular.ttf
        - asset: assets/system-fonts/NotoSansMono-Bold.ttf
          weight: 700

hooks:
  user_defines:
    flutter_soloud:
      # Only WAV (the interface sounds and the decoded theme songs), MP3 and M4A are played:
      # no Ogg, Opus, Vorbis or FLAC libraries to download and bundle.
      no_xiph_libs: true
